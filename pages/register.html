<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Criar conta | SØLID</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><main class="account-page"><div class="container"><section class="account-card account-card-wide"><h1>Criar conta</h1><p>Cadastre seus dados para comprar com mais praticidade e acompanhar seus favoritos.</p><form id="register-form" class="account-form"><div class="account-form-grid"><label>Nome completo<input id="register-name" type="text" required autocomplete="name" placeholder="Seu nome"></label><label>WhatsApp<input id="register-phone" data-phone type="tel" required inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000"></label><label class="account-full">E-mail<input id="register-email" type="email" required autocomplete="email" placeholder="nome@exemplo.com"></label><label>Senha<input id="register-password" type="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></label><label>CPF <small>(opcional)</small><input id="register-cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"></label><label>CEP<input id="register-zip" data-zip type="text" required inputmode="numeric" maxlength="9" placeholder="00000-000"></label><label class="account-full">Rua / Avenida<input id="register-address" type="text" required></label><label>Número<input id="register-number" type="text" required></label><label>Complemento <small>(opcional)</small><input id="register-complement" type="text"></label><label>Bairro<input id="register-neighborhood" type="text" required></label><label>Cidade / UF<input id="register-city" type="text" required placeholder="Ex.: Belo Horizonte / MG"></label><label class="account-full">Foto de perfil <small>(opcional, até 1,5 MB)</small><input id="register-image" type="file" accept="image/*"></label></div><label class="newsletter-choice"><input id="register-newsletter" type="checkbox"> Quero receber lançamentos, promoções e novidades por e-mail.</label><p id="account-message" class="account-message" role="alert"></p><button class="btn-primary" type="submit">Criar minha conta</button></form><p class="account-alternative">Já possui uma conta? <a href="login.html">Entrar</a></p></section></div></main><script src="../assets/js/account.js"></script><script src="../assets/js/main.js"></script><script src="../assets/js/footer.js"></script></body></html>
