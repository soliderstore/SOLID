<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shop | SØLID</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../assets/css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="header">

    <div class="container">

        <a href="../index.html" class="logo">

            <span>SØLID</span>

        </a>

        <nav class="menu">

            <a href="../index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="collections.html">Coleções</a>

            <a href="about.html">Sobre</a>

            <a href="contact.html">Contato</a>

        </nav>

        <div class="actions">

            <a href="wishlist.html">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="cart.html">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>

            <a href="login.html">
                <i class="fa-regular fa-user"></i>
            </a>

        </div>

    </div>

</header>

<main>

<section class="shop-hero">

    <div class="container">

        <span>SHOP</span>

        <h1>

            Nossa Coleção

        </h1>

        <p>

            Descubra peças desenvolvidas para quem busca
            autenticidade e qualidade.

        </p>

    </div>

</section>

<section class="shop-toolbar">

    <div class="container">

        <input
        type="text"
        placeholder="Pesquisar produtos...">

        <select>

            <option>Todas Categorias</option>

            <option>Moletom</option>

            <option>Camiseta</option>

            <option>Boné</option>

        </select>

        <select>

            <option>Ordenar</option>

            <option>Menor preço</option>

            <option>Maior preço</option>

            <option>Mais recentes</option>

        </select>

    </div>

</section>

<section class="shop-products">

    <div class="container">

        <div id="products" class="products-grid">

        </div>

    </div>

</section>

<section class="newsletter">

    <div class="newsletter-content">

        <span>NOVIDADES</span>

        <h2>

            Receba nossos lançamentos.

        </h2>

        <p>

            Seja o primeiro a conhecer novas coleções.

        </p>

        <form>

            <input
            type="email"
            placeholder="Seu e-mail">

            <button>

                Inscrever-se

            </button>

        </form>

    </div>

</section>

</main>

<footer class="footer">

    <div class="copyright">

        © 2026 SØLID.

    </div>

</footer>

<script src="../assets/js/products.js"></script>
<script src="../assets/js/shop.js"></script>
<script src="../assets/js/main.js"></script>

</body>

</html>
